app:
  name: sadp-discover
  about: Discover Hikvision devices on the local network (read-only)
  long_about: |
    Discover Hikvision devices that speak SADP.

    Sends a read-only probe over IPv4 multicast/broadcast and IPv6 link-local
    multicast, then merges every reply into one row per device. Results from
    IPv4 and IPv6 are merged by serial number / MAC, so a dual-stack device
    appears exactly once.

    This tool never modifies a device. Changing IP, activating a camera or
    resetting a password is intentionally out of scope.

cli:
  after_help: |
    EXIT CODES
      0  devices found
      1  no devices found
      2  invalid arguments or network error
      3  permission denied (firewall / raw socket)

    EXAMPLES
      sadp-discover                       # TUI, one 3 s round
      sadp-discover --repeat 1000         # keep scanning every second
      sadp-discover --json                # stable machine-readable output
      sadp-discover --family v6 --no-tui  # IPv6 only, plain text
      sadp-discover interfaces            # list adapters and multicast groups
  cmd:
    scan: Scan for devices (default)
    interfaces: List network interfaces and multicast membership
    completions: Generate shell completion scripts
    logs: Open the log folder
  arg:
    timeout: "Scan window per round, in milliseconds (default %{default})"
    repeat: "Start a new round every N ms (default: single round)"
    port: "UDP port used for discovery (default %{default})"
    local_port: "Local UDP port to bind (default: same as --port; 0 = ephemeral)"
    interface: "Restrict to adapters by name, index or address (comma separated)"
    bind: "Bind the IPv4 socket to this local address"
    family: "Address families to use: v4, v6 or both (default both)"
    v6_mcast: "IPv6 multicast group used for probing (default %{default})"
    passive: "Do not send probes; only listen for device announcements"
    json: "Print results as JSON (schema sadp.discover/v1)"
    csv: "Print results as CSV"
    output: "Write results to a file instead of stdout"
    quiet: "Print device addresses only"
    no_tui: "Disable the interactive TUI"
    lang: "UI language: en-US or zh-CN"
    log_level: "Log level: error, warn, info, debug or trace"
    save_raw: "Directory to store raw ProbeMatch datagrams in"
    stale: "Drop devices not seen for N seconds (0 = keep)"
    shell: "Shell to generate completions for"
    verbose: "Increase log verbosity (repeatable)"
  value:
    family: "v4, v6 or both"
    shell: "bash, zsh, fish, powershell or elvish"
  error:
    unknown_family: "unknown address family %{value} (expected v4, v6 or both)"
    bad_timeout: "invalid timeout %{value}"
    bad_repeat: "invalid repeat interval %{value}"
    bad_port: "invalid port %{value}"
    bad_stale: "invalid duration %{value}"
    write_failed: "cannot write %{path}: %{reason}"
  note:
    fallback_port: "port %{port} is busy; using ephemeral port %{actual} (replies may be lost)"
    repeat_needs_tui: "--repeat only applies to the interactive TUI; running a single round instead"
    window_clamped: "scan window %{timeout} ms is longer than --repeat %{repeat} ms; using %{used} ms per round"

