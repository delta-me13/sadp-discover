app:
  name: sadp-discover
  about: 发现局域网内的海康（Hikvision）设备（只读）
  long_about: |
    发现局域网内支持 SADP 协议的海康设备。

    通过 IPv4 组播/广播与 IPv6 链路本地组播发送只读探测报文，
    再把每台设备的多次应答合并成一行。IPv4 与 IPv6 的结果按序列号 / MAC
    合并，因此双栈设备只会出现一次。

    本工具不会修改设备。改 IP、激活摄像头、重置密码均不在本期范围内。

cli:
  after_help: |
    退出码
      0  发现设备
      1  未发现设备
      2  参数错误或网络错误
      3  权限被拒（防火墙 / 提权）

    示例
      sadp-discover                       # TUI，单轮 3 秒
      sadp-discover --repeat 1000         # 每秒持续扫描
      sadp-discover --json                # 稳定的机器可读输出
      sadp-discover --family v6 --no-tui  # 仅 IPv6，纯文本
      sadp-discover interfaces            # 列出网卡与组播加入情况
  cmd:
    scan: 扫描设备（默认命令）
    interfaces: 列出网卡与组播加入情况
    completions: 生成 shell 补全脚本
    logs: 打开日志文件夹
  arg:
    timeout: "单轮扫描时长，毫秒（默认 %{default}）"
    repeat: "每 N 毫秒开始新一轮（默认只扫一轮）"
    port: "发现使用的 UDP 端口（默认 %{default}）"
    local_port: "本地绑定端口（默认与 --port 相同；0 表示临时端口）"
    interface: "只使用指定网卡，按名称、索引或地址匹配（逗号分隔）"
    bind: "把 IPv4 socket 绑定到指定本地地址"
    family: "地址族：v4、v6 或 both（默认 both）"
    v6_mcast: "探测使用的 IPv6 组播地址（默认 %{default}）"
    passive: "只被动监听设备通告，不发送探测包"
    json: "以 JSON 输出结果（schema sadp.discover/v1）"
    csv: "以 CSV 输出结果"
    output: "把结果写入文件而不是标准输出"
    quiet: "只输出设备地址"
    no_tui: "关闭交互式 TUI"
    lang: "界面语言：en-US 或 zh-CN"
    log_level: "日志级别：error、warn、info、debug 或 trace"
    save_raw: "把原始 ProbeMatch 报文保存到该目录"
    stale: "超过 N 秒未再出现的设备从结果中移除（0 = 保留）"
    shell: "生成补全的目标 shell"
    verbose: "提高日志详细程度（可重复）"
  value:
    family: "v4、v6 或 both"
    shell: "bash、zsh、fish、powershell 或 elvish"
  error:
    unknown_family: "未知地址族 %{value}（应为 v4、v6 或 both）"
    bad_timeout: "无效的扫描时长 %{value}"
    bad_repeat: "无效的重复间隔 %{value}"
    bad_port: "无效的端口 %{value}"
    bad_stale: "无效的时长 %{value}"
    write_failed: "无法写入 %{path}：%{reason}"
  note:
    fallback_port: "端口 %{port} 被占用，改用临时端口 %{actual}（可能收不到部分回包）"
    repeat_needs_tui: "非交互模式下 --repeat 不生效，已改为单轮扫描"
    window_clamped: "扫描窗口 %{timeout}ms 长于 --repeat %{repeat}ms，每轮窗口改为 %{used}ms"

