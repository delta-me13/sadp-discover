[package]
name = "sadp-gui"
description = "sadp-discover 图形界面（egui，三阶段）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sadp-discover-gui"
path = "src/main.rs"

[dependencies]
sadp-core = { workspace = true }
sadp-net = { workspace = true }
clap = { workspace = true }
egui_extras = "0.37"
fontdb = "0.24"
rfd = "0.15"
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# macOS / Linux：沿用 eframe 默认后端（wgpu），与上游默认一致。
[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = "0.37"

# Windows：wgpu 30 的 D3D12 绑定与 windows 0.62.2 不兼容（wgpu-hal 编译失败，
# 见 CI run 43245594522），改用 glow（OpenGL）后端规避；等上游修复后可去掉该块。
[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "accesskit",
  "clipboard",
  "default_fonts",
  "glow",
  "links",
] }
# 只用到 AttachConsole / SetStdHandle / GetFileType：GUI 以 windows 子系统发布，
# 从命令行启动时要自己挂回父进程的控制台，否则 --version 的输出没人收。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
] }

# 把图标、清单与版本信息嵌进 exe（非 Windows 目标下 build.rs 直接跳过）。
[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true
