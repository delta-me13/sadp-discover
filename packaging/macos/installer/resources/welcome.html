<p>这个安装包会把 <b>sadp-discover</b> 装到两个位置：</p>
<p>
  · <code>/Applications/sadp-discover.app</code> —— 双击启动图形界面；<br>
  · <code>/usr/local/bin/sadp-discover</code> —— 终端里直接可用的命令行版本。
</p>
<p>两者是同一份扫描实现，版本与结果一致。安装到系统卷需要管理员密码。</p>
