name: release

# 正式发布只认 tag：v0.1.0、v1.2.3-rc1（带连字符的自动按 prerelease 发布）。
# 地址：把「能不能合并」（dev.yml）和「能不能发」彻底分开——
# 这里才做 release 构建、签名、公证与打包。
#
# 另有 workflow_dispatch 试跑：用同一套 job 构建、上传 artifact，但绝不创建 Release。
# 用途是在没有证书、也不想先打 tag 的情况下，验证两条打包链路（尤其是从未跑过的
# macOS 通用二进制 → .app → .pkg → .dmg → 安装冒烟）。没有 secrets 时签名自动降级：
# Windows 保持未签名、macOS 走 ad-hoc，这正是当前仓库的实际发布形态。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "试跑版本号，必须与 Cargo.toml 一致（不带 v）"
        required: true
        default: "0.1.0-rc.1"
      dry_run:
        description: "只构建并上传 artifact，不创建 GitHub Release"
        type: boolean
        default: true

run-name: release ${{ inputs.version || github.ref_name }}${{ inputs.dry_run && ' (dry-run)' || '' }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 发布前的最后一道闸：版本号必须与 Cargo.toml 一致，
  # 否则会出现「包叫 1.0.0、--version 却报 0.1.0」的发布事故。
  # tag 触发时比对 tag；手动试跑时比对 input，绝不因为「试跑」而跳过闸门。
  # 预发布 tag（v0.1.0-rc1）只放宽「-」后缀：数字部分仍须等于 Cargo.toml，
  # 否则 rc 就成了「版本号不用改也能发版」的旁路。
  version:
    name: version gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            raw="${INPUT_VERSION#"v"}"
            label="input ${INPUT_VERSION}"
          else
            raw="${GITHUB_REF_NAME}"
            label="tag ${GITHUB_REF_NAME}"
          fi
          tag="${raw#v}"
          manifest=$(cargo pkgid -p sadp-cli | sed -e 's/.*[#@]//')
          # v0.1.0-rc1 这类预发布 tag 只放宽后缀：数字部分必须与 Cargo.toml 相同，
          # 产物名仍取 Cargo.toml 的版本（0.1.0），只有 Release 标题与 tag 带 rc。
          if [ "$tag" != "$manifest" ] && [ "${tag%%-*}" != "$manifest" ]; then
            echo "::error::${label} 与 Cargo.toml 的 $manifest 不一致（预发布请用 ${manifest}-rc1 形式），先改版本号再构建"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # 依赖许可 / 漏洞 / 来源审计。从 dev 挪到这里：PR 上不跑，发布前必须过。
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  windows:
    name: windows
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # ARM64 在 x64 runner 上交叉编译；windows-latest 镜像自带 ARM64 C++ 工具链。
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存键 = job + OS + arch + rustc 版本（含 rustup 里所有 toolchain）+ manifest 哈希。
          # 注意：tag 运行有自己的 ref 作用域，通常拿不到 main 的缓存，首轮发布构建基本是冷的；
          # cache-on-failure 只保证「同一 tag 重跑」能命中。
          cache-on-failure: true

      # 构建 → 便携 zip → Inno Setup 安装器 → MSI → 校验和，全在脚本里，
      # 与 dev 的打包自检跑的是同一份代码（这里只多一个 tag 版本闸门）。
      - name: Build x64, package, installer, MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Arch x64

      # 装到一个临时目录、跑两个 exe、再静默卸载：只有这一步能证明安装器布局是对的。
      - name: Install smoke test (Inno, x64)
        shell: pwsh
        run: ./scripts/windows/smoke-install.ps1 -Arch x64

      - name: Install smoke test (MSI, x64)
        shell: pwsh
        run: ./scripts/windows/smoke-msi.ps1 -Arch x64

      # ARM64 交叉编译：x64 主机执行不了产物，架构由 build.ps1 读 PE 头断言。
      - name: Build ARM64 (cross), package, installer, MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Arch arm64

      # upload-artifact 保留相对路径：dist/*.zip 与 dist/windows/*.exe 的公共前缀是
      # dist，setup.exe / msi 会落进 windows/ 子目录。publish 里的 sha256sum * 会因此
      # 踩到目录，gh release create release/* 也会漏掉安装器。先在 dist 根放一份。
      - name: Stage artifacts flat
        shell: pwsh
        run: |
          Copy-Item -Path dist/windows/*.exe -Destination dist/
          Copy-Item -Path dist/windows/*.msi -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS-windows*.txt
          if-no-files-found: error

  macos:
    name: macos universal
    runs-on: macos-latest
    needs: version
    env:
      # 只把「有没有密钥」这个布尔值放进 job 环境；真正的证书/密钥只在需要的 step 里注入，
      # 避免它们出现在 cargo build 期间的环境变量里（依赖的 build script 也能看到那些变量）。
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存键 = job + OS + arch + rustc 版本（含 rustup 里所有 toolchain）+ manifest 哈希。
          # 注意：tag 运行有自己的 ref 作用域，通常拿不到 main 的缓存，首轮发布构建基本是冷的；
          # cache-on-failure 只保证「同一 tag 重跑」能命中。
          cache-on-failure: true

      - name: Import signing identities
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certs.p12"

      - name: Resolve signing identities
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          app_id=$(security find-identity -v -p codesigning | \
            sed -n 's/.*"\(Developer ID Application.*\)"/\1/p' | head -1)
          installer_id=$(security find-identity -v | \
            sed -n 's/.*"\(Developer ID Installer.*\)"/\1/p' | head -1)
          [ -n "$app_id" ] || { echo "::error::没找到 Developer ID Application 证书"; exit 1; }
          echo "CODESIGN_IDENTITY=$app_id" >> "$GITHUB_ENV"
          if [ -n "$installer_id" ]; then
            echo "INSTALLER_IDENTITY=$installer_id" >> "$GITHUB_ENV"
          fi

      - name: Prepare notary key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$key"
          {
            echo "ASC_KEY_PATH=$key"
            echo "ASC_KEY_ID=$NOTARY_KEY_ID"
            echo "ASC_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build universal CLI
        env:
          TARGETS: aarch64-apple-darwin x86_64-apple-darwin
        run: bash scripts/macos/build.sh

      - name: Build universal GUI
        env:
          TARGETS: aarch64-apple-darwin x86_64-apple-darwin
          PACKAGES: sadp-gui
        run: bash scripts/macos/build.sh

      - name: Sign binaries
        run: bash scripts/macos/sign.sh dist/sadp-discover dist/sadp-discover-gui

      - name: Bundle .app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/macos/bundle.sh

      # app 必须先在 bundle 里 staple，再进 pkg：
      # 只公证 pkg 的话，用户装完断网启动会查不到票。
      - name: Notarize .app
        run: bash scripts/macos/notarize.sh dist/sadp-discover.app

      - name: Build .pkg
        run: bash scripts/macos/pkg.sh

      - name: Notarize .pkg
        run: bash scripts/macos/notarize.sh dist/*.pkg

      # dmg 里放的是「已 staple 的 app」的副本：只公证 dmg 而不公证 app 的话，
      # 从 dmg 拖进 /Applications 的用户断网启动仍然查不到离线票据。
      - name: Build .dmg
        run: bash scripts/macos/dmg.sh

      - name: Notarize .dmg
        run: bash scripts/macos/notarize.sh dist/*.dmg

      - name: Verify .dmg
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" -noautoopen dist/*.dmg >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          test -d "$mnt/sadp-discover.app"
          test -L "$mnt/Applications"
          "$mnt/sadp-discover.app/Contents/MacOS/sadp-discover" --version

      # CLI 单独一份 tar.gz，给 Homebrew / 脚本安装用。
      - name: Archive CLI tarball
        run: bash scripts/macos/package.sh dist/sadp-discover

      - name: Checksums
        run: cd dist && shasum -a 256 *.pkg *.dmg *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      # 装一遍再跑：这是唯一能验证「pkg 布局真的对」的步骤
      # （/Applications 下的 app、/usr/local/bin 下的 CLI 都能直接用）。
      - name: Install smoke test
        run: |
          set -euo pipefail
          sudo installer -pkg dist/*.pkg -target /
          # 先确认 app 真的落在 /Applications：Installer 的 bundle 重定位会让
          # 「安装成功」和「/Applications 下没有 app」同时成立，不显式断言就会被
          # 下一行一句 No such file or directory 带偏。
          if [ ! -d /Applications/sadp-discover.app ]; then
            echo "::error::安装报成功，但 /Applications 下没有 sadp-discover.app（检查 pkg 的 BundleIsRelocatable）"
            ls -la /Applications | head -40
            pkgutil --pkgs | grep -i sadp || true
            exit 1
          fi
          /usr/local/bin/sadp-discover --version
          /Applications/sadp-discover.app/Contents/MacOS/sadp-discover-gui --version
          which sadp-discover

      - name: Verify Gatekeeper
        if: env.HAS_NOTARY == 'true'
        run: |
          spctl -a -vvv -t exec dist/sadp-discover.app
          spctl -a -vvv -t install dist/*.pkg
          # dmg 的判定类型是 open + primary signature，不是 exec。
          spctl -a -vvv -t open --context context:primary-signature dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.pkg
            dist/*.dmg
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [version, windows, macos]
    # 手动试跑永远不发布：构建与上传 artifact 已经完成，这里只负责「打 tag 才发」。
    if: github.event_name == 'push'
    steps:
      # 发布页正文取自 CHANGELOG.md，所以要 checkout（tag 的树，不是 main 的树）。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # 防御性展平：artifact 沿用上传时的相对路径，历史上 windows 安装器曾在
      # windows/ 子目录里。不展平的话 sha256sum * 会把目录当文件报错，
      # 而 gh release create release/* 只匹配一层，安装器会被静默漏发。
      - name: Flatten artifacts
        run: |
          set -euo pipefail
          cd release
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -l

      # 五个交付物一个都不能少：少了 pkg/dmg/zip/setup 里任何一个，Release 都是残缺的，
      # 而 gh release create 的 glob 不会因为少一个文件而报错。
      - name: Verify asset set
        run: |
          set -euo pipefail
          cd release
          for pattern in '*-macos.pkg' '*-macos.dmg' '*-macos-universal.tar.gz' \
                         '*-windows-x86_64.zip' '*-windows-x86_64-setup.exe' '*-windows-x86_64.msi' \
                         '*-windows-arm64.zip' '*-windows-arm64-setup.exe' '*-windows-arm64.msi'; do
            found=$(compgen -G "$pattern" || true)
            if [ -z "$found" ]; then
              echo "::error::缺少产物 ${pattern}"
              exit 1
            fi
          done

      # 两个构建 job 各自写过的 SHA256SUMS 会被 merge-multiple 覆盖掉一个，
      # 所以在这里按「最终的产物清单」重新算一遍，只留这一份。
      - name: Regenerate checksums
        run: |
          set -euo pipefail
          cd release
          rm -f SHA256SUMS*.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 正文不手写：CHANGELOG 的 [version] 段落 + 按真实产物生成的下载表，
      # 与 tag 的树和附件一一对应，可复现。没有该版本段落时回退到自动 notes。
      - name: Render release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if bash scripts/release/notes.sh "$VERSION" release > "$RUNNER_TEMP/release-notes.md"; then
            echo "正文由 scripts/release/notes.sh 生成（$VERSION）"
          else
            rm -f "$RUNNER_TEMP/release-notes.md"
            echo "::warning::CHANGELOG 里没有 [$VERSION] 段落，回退到 --generate-notes"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # --repo：不依赖当前目录是不是 git 仓库。
          args=(--repo "$GITHUB_REPOSITORY" --title "sadp-discover $VERSION")
          if [ -f "$RUNNER_TEMP/release-notes.md" ]; then
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          # 带连字符的 tag（v1.2.3-rc.1）按预发布处理。
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" release/*
