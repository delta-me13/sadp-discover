name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 连续 push 时只保留最新一轮：避免同一分支上多个完整构建并行（runner 也省）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 只做检查与测试，不产出 release 产物；产物统一由下面两个 job 负责，避免重复构建。
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 与 macos-latest(=macos-26) 覆盖两代系统；
        # Intel 由交叉检查与通用二进制构建覆盖（macos-14 镜像已于 2026-10 退役）。
        os: [windows-latest, macos-15, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cross-check Intel macOS target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --target x86_64-apple-darwin

      - name: Test
        run: cargo test --workspace

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 假设备依赖真实网卡的组播回环；GitHub runner 上通常可用，
      # 若被防火墙拦截则该 job 失败，属于环境问题而非代码回归。
      - name: Fake device end-to-end
        run: cargo test -p sadp-fake-device -- --ignored --nocapture

  # Windows 产物：CLI + GUI。macOS 的产物在 macos-universal 里一起出，避免两个 macOS 构建 job。
  release-windows:
    name: release (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p sadp-cli -p sadp-gui

      - name: Smoke test
        run: |
          .\target\release\sadp-discover.exe --version
          .\target\release\sadp-discover-gui.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: sadp-discover-windows-msvc
          path: |
            target/release/sadp-discover.exe
            target/release/sadp-discover-gui.exe
          if-no-files-found: error

  # macOS 产物：CLI 通用二进制（arm64 + x86_64）+ GUI（arm64）。
  macos-universal:
    name: release (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build universal CLI
        run: bash scripts/build-macos-universal.sh

      - name: Build GUI (arm64)
        run: cargo build --release -p sadp-gui

      - name: Verify architectures
        run: |
          lipo -info dist/sadp-discover
          file dist/sadp-discover
          file target/release/sadp-discover-gui

      - name: Smoke test
        run: |
          ./dist/sadp-discover --version
          ./target/release/sadp-discover-gui --version
          # 不要直接管道给 head：Rust 默认忽略 SIGPIPE，管道提前关闭会让进程报错。
          ./dist/sadp-discover interfaces --json > interfaces.json
          head -20 interfaces.json

      - uses: actions/upload-artifact@v4
        with:
          name: sadp-discover-macos-universal
          path: |
            dist/sadp-discover-*.tar.gz
            target/release/sadp-discover-gui
          if-no-files-found: error

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
