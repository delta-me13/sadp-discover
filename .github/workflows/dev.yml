name: dev

# 日常检查：能不能合并。
# 只跑「测试 + 假设备端到端」，不产出任何产物——产物构建、签名、公证都在 release.yml，
# 那是 tag 触发的事，没必要每次 push 都跑一遍双架构 + 公证。
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 连续 push 时只保留最新一轮：避免同一分支上多个完整构建并行（runner 也省）。
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 与 macos-latest(=macos-26) 覆盖两代系统；
        # Intel 由交叉检查与 release 的通用二进制覆盖（macos-14 镜像已于 2026-10 退役）。
        os: [windows-latest, macos-15, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存键 = job + OS + arch + rustc 版本 + Cargo.toml/Cargo.lock 哈希。
          # 失败时也保存：否则一次红灯之后，下一轮必然冷启动。
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cross-check Intel macOS target
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --target x86_64-apple-darwin

      - name: Test
        run: cargo test --workspace

  # 假设备端到端只在 Windows runner 上跑：macOS 15+ 的本地网络权限在托管 runner 上
  # 没人去点"允许"，组播收不到回包（同一用例连续两轮都失败，见 run 43256691672）。
  # 真机 macOS 上该用例是通过的（Gate 2 用假设备验证过），属环境限制而非代码回归。
  e2e:
    name: e2e (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 缓存键 = job + OS + arch + rustc 版本 + Cargo.toml/Cargo.lock 哈希。
          # 失败时也保存：否则一次红灯之后，下一轮必然冷启动。
          cache-on-failure: true

      # 假设备依赖真实网卡的组播回环；GitHub runner 上通常可用，
      # 若被防火墙拦截则该 job 失败，属于环境问题而非代码回归。
      - name: Fake device end-to-end
        run: cargo test -p sadp-fake-device -- --ignored --nocapture

  # Windows 打包自检：只在 push 到 main 时跑，PR 保持快。
  # 打包脚本、Inno Setup 安装器、PATH 增删都走一遍，不然这些代码只在打 tag 时
  # 才会被执行，坏了要等到发布当天才发现。
  package-windows:
    name: package (windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # 这个仓库没有 gh token，runner 上的日志下载不了；失败时把尾巴塞进
      # GitHub 的 annotation（公开仓库可以匿名读），否则只能看到一个「红」。
      # 先落盘再读：脚本抛异常时管道里的缓冲会一起丢掉。
      - name: Build, package, installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build-windows.log'
          $code = 0
          try {
            & ./scripts/build-windows.ps1 *> $log
            $code = $LASTEXITCODE
          } catch {
            $code = 1
            Add-Content -Path $log -Value ($_ | Out-String)
          }
          Get-Content -Path $log -Tail 40 | Write-Host
          if ($code -ne 0) {
            $text = (Get-Content -Path $log -Raw)
            $tail = $text.Substring([Math]::Max(0, $text.Length - 3000)) -replace '\r?\n', '%0A'
            Write-Host "::error title=windows-build::$tail"
            exit 1
          }

      - name: Install smoke test (Inno)
        shell: pwsh
        run: ./scripts/windows/smoke-install.ps1

      - name: Install smoke test (MSI)
        shell: pwsh
        run: ./scripts/windows/smoke-msi.ps1

      # 与 release 同样的理由：upload-artifact 会保留相对路径，先把 setup.exe / msi
      # 挪到 dist 根，artifact 里才是平铺的，下载后一眼能看全。
      - name: Stage artifacts flat
        shell: pwsh
        run: |
          Copy-Item -Path dist/windows/*.exe -Destination dist/
          Copy-Item -Path dist/windows/*.msi -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS-windows*.txt
          retention-days: 3

  # ARM64：在 x64 runner 上交叉编译（VS 镜像自带 ARM64 C++ 工具链）。
  # 不跑安装冒烟：x64 主机执行不了 ARM64 的 exe；架构由 build.ps1 读 PE 头断言。
  package-windows-arm64:
    name: package (windows arm64)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build ARM64 (cross)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'build-windows-arm64.log'
          $code = 0
          try {
            & ./scripts/build-windows.ps1 -Arch arm64 *> $log
            $code = $LASTEXITCODE
          } catch {
            $code = 1
            Add-Content -Path $log -Value ($_ | Out-String)
          }
          Get-Content -Path $log -Tail 40 | Write-Host
          if ($code -ne 0) {
            $text = (Get-Content -Path $log -Raw)
            $tail = $text.Substring([Math]::Max(0, $text.Length - 3000)) -replace '\r?\n', '%0A'
            Write-Host "::error title=windows-arm64-build::$tail"
            exit 1
          }

      - name: Stage artifacts flat
        shell: pwsh
        run: |
          Copy-Item -Path dist/windows/*.exe -Destination dist/
          Copy-Item -Path dist/windows/*.msi -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-package
          path: |
            dist/*windows-arm64.zip
            dist/*windows-arm64-setup.exe
            dist/*windows-arm64.msi
            dist/SHA256SUMS-windows-arm64.txt
          if-no-files-found: error
          retention-days: 3
